[project]
name = "isle-routes-research"
version = "0.1.0"
description = "Isle Routes (original 4-player hex resource game) AI research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: 時間のかかる強さの検証（scripts/check.py --quick では飛ばす）"]

[tool.ruff]
line-length = 100
# docs/py/ は src/isle の写し（scripts/build_pages.py が作る）
extend-exclude = ["docs/py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 姉妹プロジェクトから写した多言語化の部品（長い文と正規表現をそのまま持つ）
"scripts/i18n.py" = ["E501"]
